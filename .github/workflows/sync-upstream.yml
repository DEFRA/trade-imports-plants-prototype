name: Sync upstream

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    name: Sync from trade-imports-plants-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npm run playwright:install

      - name: Set git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync from upstream and open a PR
        run: npm run sync:upstream -- --push --summary "$RUNNER_TEMP/sync.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
