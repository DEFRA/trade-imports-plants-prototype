name: Check Pull Request

# Besides checking a pull request, this publishes a site to gh-pages: the
# stakeholder demo page (the most important journeys first, built by
# scripts/reports/demo/) at the root, and the full merged Playwright report
# (FIT tests and every walkthrough, with video, pictures and trace) under
# tests/. reports/pr-<n>/ for a pull request, the site root for main (a push,
# the Monday run, or a manual run on main) — so the lasting link never
# depends on a pull request having existed. prune-reports.yml cleans up
# closed pull requests' folders; it never touches the root site.
on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same pull request replaces an older one, so an older
# report never lands on top of a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The npm that installs must be the npm that generated package-lock.json:
      # different npms resolve some transitive trees differently, and `npm ci`
      # then rejects a lockfile generated by the other one. Take the version
      # from `packageManager` rather than inheriting whatever npm the Node
      # version happens to bundle. The helper validates the field and strips any
      # Corepack integrity suffix, so a malformed pin fails the step instead of
      # installing the wrong npm.
      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - run: |
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag trade-imports-plants-prototype .
          exit $?

  # Proves the built image is the thing that reaches CDP dev, not just that it
  # builds: boots it in NODE_ENV=production and drives a full stub sign-in,
  # the same route a trader takes on the deployed prototype. Production
  # deliberately honours STUB_MODE (Sam's decision — see mode.js and
  # production-run.test.js), so no Defra ID stub is needed here. Runs after
  # pr-validator so it never boots an image that failed unit tests or the
  # plain `docker build`.
  boot-check:
    name: Production boot check
    runs-on: ubuntu-latest
    needs: pr-validator
    timeout-minutes: 15
    env:
      APP_PORT: 3103
      PASSWORD_APP_PORT: 3104
      BOOT_CHECK_PASSWORD: boot-check-throwaway-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the image under test
        run: docker build --tag trade-imports-plants-prototype .

      - name: Start the prototype
        run: |
          docker run -d --name plants-prototype \
            -p "${APP_PORT}:${APP_PORT}" \
            -e NODE_ENV=production \
            -e "PORT=${APP_PORT}" \
            -e STUB_MODE=true \
            -e SESSION_COOKIE_SECURE=false \
            trade-imports-plants-prototype

      - name: Wait for the prototype to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl --fail --silent "http://localhost:${APP_PORT}/health" && exit 0
            sleep 2
          done
          echo "The prototype never became healthy" >&2
          docker logs plants-prototype
          exit 1

      - name: Assert the chooser and a real page's sign-in are wired up
        run: |
          chooser_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:${APP_PORT}/")
          if [ "$chooser_status" != "200" ]; then
            echo "Expected the chooser at / to be 200 signed out, got $chooser_status" >&2
            exit 1
          fi

          # The prototype's own `/` is the chooser, not a redirect (it stands
          # in for plants-frontend's redirect to its default set — see
          # src/server/prototype-sets/index.js) — a real set behind it is
          # where sign-in is enforced, the same as plants-frontend's `/`.
          # Only the path is checked: the query (today
          # ?redirect=%2Fhigh-risk-plants, to come back after sign-in) is the
          # app's own business and allowed on purpose.
          real_set_redirect=$(curl --silent --output /dev/null --write-out '%{redirect_url}' "http://localhost:${APP_PORT}/high-risk-plants")
          redirect_path="${real_set_redirect%%\?*}"
          case "$redirect_path" in
            http://*|https://*) redirect_path="/${redirect_path#*://*/}" ;;
          esac
          if [ "$redirect_path" != "/auth/sign-in" ]; then
            echo "Expected /high-risk-plants to redirect to /auth/sign-in signed out, got: $real_set_redirect" >&2
            exit 1
          fi

      - name: Sign in with stub sign-in and reach the chooser
        run: |
          jar="$RUNNER_TEMP/boot-check-cookies.txt"

          chooser_page=$(curl --silent --cookie-jar "$jar" --cookie "$jar" --location "http://localhost:${APP_PORT}/auth/sign-in")
          if ! echo "$chooser_page" | grep -q 'href="/high-risk-plants"'; then
            echo "Did not land back on the chooser after sign-in" >&2
            exit 1
          fi

          echo "BOOT_CHECK_COOKIE_JAR=$jar" >> "$GITHUB_ENV"

      - name: Open a release page
        run: |
          status=$(curl --silent --cookie "$BOOT_CHECK_COOKIE_JAR" --output /dev/null --write-out '%{http_code}' "http://localhost:${APP_PORT}/high-risk-plants")
          if [ "$status" != "200" ]; then
            echo "Expected the high-risk-plants dashboard to be 200 signed in, got $status" >&2
            exit 1
          fi

      - name: Open an example link
        run: |
          status=$(curl --silent --cookie "$BOOT_CHECK_COOKIE_JAR" --location --output /dev/null --write-out '%{http_code}' "http://localhost:${APP_PORT}/examples/high-risk-plants/submitted")
          if [ "$status" != "200" ]; then
            echo "Expected the submitted example link to be 200 signed in, got $status" >&2
            exit 1
          fi

      # The same image again, the way CDP runs it once the PROTOTYPE_PASSWORD
      # secret is set (src/server/prototype-password): /health stays open for
      # the platform, every page sends a stranger to the password page, and a
      # real form post (crumb and all) gets past it to the chooser. The
      # password here is a throwaway, not the deployed one.
      - name: Start the prototype with a password
        run: |
          docker run -d --name plants-prototype-password \
            -p "${PASSWORD_APP_PORT}:${PASSWORD_APP_PORT}" \
            -e NODE_ENV=production \
            -e "PORT=${PASSWORD_APP_PORT}" \
            -e STUB_MODE=true \
            -e SESSION_COOKIE_SECURE=false \
            -e "PROTOTYPE_PASSWORD=${BOOT_CHECK_PASSWORD}" \
            trade-imports-plants-prototype

      - name: Wait for the password-protected prototype to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl --fail --silent "http://localhost:${PASSWORD_APP_PORT}/health" && exit 0
            sleep 2
          done
          echo "The password-protected prototype never became healthy" >&2
          docker logs plants-prototype-password
          exit 1

      - name: Assert every page asks for the password first
        run: |
          for page in / /high-risk-plants /auth/sign-in /examples/high-risk-plants/submitted; do
            redirect=$(curl --silent --output /dev/null --write-out '%{redirect_url}' "http://localhost:${PASSWORD_APP_PORT}${page}")
            redirect_path="${redirect%%\?*}"
            case "$redirect_path" in
              http://*|https://*) redirect_path="/${redirect_path#*://*/}" ;;
            esac
            if [ "$redirect_path" != "/prototype-password" ]; then
              echo "Expected ${page} to redirect to /prototype-password without the password, got: $redirect" >&2
              exit 1
            fi
          done

      - name: Enter the password and reach the chooser
        run: |
          jar="$RUNNER_TEMP/boot-check-password-cookies.txt"
          base="http://localhost:${PASSWORD_APP_PORT}"

          password_page=$(curl --silent --cookie-jar "$jar" --cookie "$jar" "${base}/prototype-password")
          crumb=$(echo "$password_page" | sed -n 's/.*name="crumb" value="\([^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$crumb" ]; then
            echo "The password page carried no CSRF crumb" >&2
            exit 1
          fi

          wrong_status=$(curl --silent --cookie-jar "$jar" --cookie "$jar" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "crumb=${crumb}" --data-urlencode "returnUrl=/" --data-urlencode "password=not-the-password" \
            "${base}/prototype-password")
          if [ "$wrong_status" != "400" ]; then
            echo "Expected a wrong password to be refused with 400, got $wrong_status" >&2
            exit 1
          fi

          chooser_page=$(curl --silent --cookie-jar "$jar" --cookie "$jar" --location \
            --data-urlencode "crumb=${crumb}" --data-urlencode "returnUrl=/" --data-urlencode "password=${BOOT_CHECK_PASSWORD}" \
            "${base}/prototype-password")
          if ! echo "$chooser_page" | grep -q 'href="/high-risk-plants"'; then
            echo "Did not land on the chooser after entering the password" >&2
            exit 1
          fi

      - name: Show container logs
        if: failure()
        run: |
          docker logs plants-prototype || true
          docker logs plants-prototype-password || true

      - name: Tear down
        if: always()
        run: |
          docker rm --force plants-prototype || true
          docker rm --force plants-prototype-password || true

  # Proves on every pull request — and every Monday, after the weekly update
  # from plants-frontend — that a designer can still make a design release
  # from the real journey: the copy boots, lints, passes the unit suite and
  # shows on the chooser. Runs after the unit tests. The release it makes is
  # thrown away at the end and never committed.
  release-canary:
    name: Design release canary
    runs-on: ubuntu-latest
    needs: pr-validator
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      # plants-working is the id every designer's first release gets
      # (CLAUDE.md rule 9), and designer docs name example paths inside it, so
      # the canary proves that exact release can be saved.
      - name: Make a throwaway design release from the real journey
        run: npm run new:set -- plants-working --from high-risk-plants --title "Working release" --describe "A throwaway copy of the real journey, made by CI"

      # designer:check --full is what a designer runs before saving: the
      # quick checks (copy usage, templates, the prototype checks), then the
      # pre-commit hook's own format check, lint and unit tests. Running it
      # here catches a weekly update that changes the real journey's shape in
      # a way the checks do not yet understand, before a designer meets it.
      - name: Tidy the release's new lines, as new:set asks
        run: npm run designer:format

      - name: Full designer check with the release mounted
        run: npm run designer:check -- --set plants-working --full

      - name: Install the Playwright browser
        run: npm run playwright:install

      - name: Chooser boot check with the release mounted
        run: npm run test:fit -- --project=journeys fit/sets-chooser.fit.spec.js

      # Proves a brand-new release gets its walkthrough with no designer
      # effort: made from its examples at run time, nothing written for it.
      # --fast: this proves the story reaches the end, not that the video is
      # watchable, so it skips human pacing and keeps this job's 25-minute
      # limit.
      - name: Walk the throwaway release through
        run: npm run designer:walkthrough -- --ci --fast --set plants-working

      # Proves a brand-new release gets its service map with no code written
      # for it: its pages, branches and pictures read from its own files.
      - name: Map the throwaway release
        run: npm run designer:service-map -- --set plants-working --no-open

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-canary-playwright-report
          path: |
            playwright-report/
            test-results/
            walkthrough-results/
            .cache/designer/walkthrough/
          include-hidden-files: true
          retention-days: 14

      - name: Throw the canary release away
        if: always()
        run: |
          git restore .
          git clean -fdq -- src/server

  # Deliberately a separate job from pr-validator. `npm audit` scans the whole
  # installed tree against a live advisory feed, so a newly published advisory
  # turns every open PR red regardless of what that PR changed — and advisories
  # on indirect dependencies often have no upgrade path, needing a hand-written
  # `overrides` entry on main to clear. Folded into pr-validator, that failure
  # mode blocks the very PR carrying the fix. Kept separate, the audit stays
  # visible on every PR without being the check that gates the merge.
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run security-audit

  # The frontend owns two Playwright projects — `features` and `journeys` —
  # which boot the app themselves with STUB_MODE=true: stub data and a locally
  # signed session in place of the Defra ID round-trip, auth still enforced (see
  # src/server/auth/stub-sign-in.js), so they need no workspace stack. Kept out
  # of pr-validator so a browser run does not sit in front of the rest of the
  # PR checks.
  playwright:
    name: FIT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      # Chromium only: both projects use devices['Desktop Chrome'].
      - name: Install the Playwright browser
        run: npm run playwright:install

      # Video, pictures and trace for every test, for the published report.
      # The last --reporter wins, so this adds a blob report (merged below)
      # to test:fit:ci's own reporters.
      - name: Run the frontend-owned Playwright suites
        env:
          PLAYWRIGHT_RECORD_EVERYTHING: 'true'
        run: npm run test:fit:ci -- --reporter=list,github,html,blob

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-fit
          path: blob-report/
          retention-days: 3

  # Documentation, not a gate: every set's examples walked through page by
  # page, made at run time from fit/walkthroughs/. A story that stops part way
  # is a warning; this job fails only when the walkthroughs could not run at
  # all. Never make it a required check.
  walkthroughs:
    name: Walkthroughs
    runs-on: ubuntu-latest
    # Human pacing (scripts/designer/walkthrough/pace.js) makes a walk take
    # far longer than the old fixed slowMo did. When this job goes over 25
    # minutes, turn it into a matrix of --shard=i/n (blob reports shard
    # cleanly: the merge job's copy loop below already renames each zip
    # under blob-walkthroughs-*, and only needs its pattern widened to
    # blob-walkthroughs*).
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npm run playwright:install

      - name: Walk every set through
        run: npm run designer:walkthrough -- --ci

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-walkthroughs
          path: blob-report/
          retention-days: 3

      - name: Upload the walkthrough results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-results
          path: |
            walkthrough-results/
            test-results/
          retention-days: 14

  # One report holding the FIT tests and the walkthroughs. Playwright names a
  # blob report after the command that made it (report.zip, or
  # report-<project>-<hash>.zip), so each is copied under its job's name to
  # be sure two never collide.
  merge-report:
    name: Merge the Playwright report
    runs-on: ubuntu-latest
    needs: [playwright, walkthroughs]
    if: always() && (needs.playwright.result != 'skipped' || needs.walkthroughs.result != 'skipped')
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - name: Download the blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: all-blobs

      - name: Put the blob reports side by side
        run: |
          mkdir -p merged-blobs
          for part in fit walkthroughs; do
            found=false
            for zip in all-blobs/blob-${part}/*.zip; do
              [ -f "$zip" ] || continue
              cp "$zip" "merged-blobs/${part}-$(basename "$zip")"
              found=true
            done
            if [ "$found" = false ]; then
              echo "No ${part} report to merge."
            fi
          done
          ls merged-blobs

      - name: Merge them into one report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            export REPORT_TITLE="Plants prototype, PR #${PR_NUMBER}: ${HEAD_REF}"
          else
            export REPORT_TITLE="Plants prototype, ${REF_NAME} at ${SHA:0:7}"
          fi
          npm run reports:merge -- merged-blobs

      # A missing artifact just means the walkthroughs job did not produce
      # one (it crashed, or was skipped): reports:demo below writes the
      # "did not run this time" page instead of failing.
      - name: Download the walkthrough results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: walkthrough-results
          path: walkthrough-download

      # Only puts the pull request's own release first on the demo page: if
      # the listing fails, the page is still built, in the usual order.
      - name: List the pull request's changed files
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename' > changed-files.txt

      # Copies the merged FIT-and-walkthroughs report to site/tests/, then
      # builds the stakeholder demo page (index.html + demo.css) alongside
      # it from the walkthrough report on its own (for the featured videos
      # and pictures) and the merged report (for real #?testId= links). The
      # download this job's artifact holds now holds site/index.html (the
      # demo page) and site/tests/index.html (the full technical report).
      - name: Build the demo page
        run: |
          mkdir -p site/tests
          cp -R playwright-report/. site/tests/
          npm run reports:demo -- \
            --report walkthrough-download/walkthrough-results/report.json \
            --results walkthrough-download/test-results \
            --links merged/report.json \
            --site site \
            ${{ github.event_name == 'pull_request' && '--changed-files changed-files.txt' || '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # The service map of every set, beside the demo page it links from:
      # site/service-map/<set>/ (the page, service-map.json, screens.json)
      # and site/service-map/index.html. Made from each set's own journey
      # files; the walkthrough pictures are added when there are any. A set
      # whose map cannot be drawn gets a page saying so and a warning here,
      # never a failed job.
      - name: Build the service maps
        run: |
          npm run reports:service-map -- \
            --report walkthrough-download/walkthrough-results/report.json \
            --results walkthrough-download/test-results \
            --site site \
            ${{ github.event_name == 'pull_request' && '--changed-files changed-files.txt' || '' }}
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload the merged report
        uses: actions/upload-artifact@v7
        with:
          name: prototype-playwright-report
          path: |
            site/
            merged/report.json
          retention-days: 14

  # Publishes the demo page and the technical report (site/, with the demo
  # page at its root and the merged report under tests/) to gh-pages, then
  # comments its link on the pull request. When GitHub Pages is not turned
  # on, the comment points at the prototype-playwright-report download
  # instead, and nothing fails. Skipped for a pull request from a fork or
  # one Dependabot pushed to: both get a read-only token, so the push and
  # the comment could only fail. Their site is still in the
  # prototype-playwright-report download.
  publish-report:
    name: Publish the Playwright report
    runs-on: ubuntu-latest
    needs: merge-report
    if: >
      always() &&
      needs.merge-report.result == 'success' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
      pull-requests: write
      issues: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download the merged report
        uses: actions/download-artifact@v8
        with:
          name: prototype-playwright-report
          path: .

      # Main (a push, the Monday run, or a manual run on main) publishes to
      # the site root, so the lasting link never depends on a pull request
      # having existed. A pull request keeps its own reports/pr-<n>/ folder,
      # so several can be shared at once without going anywhere near main.
      - name: Work out where the report goes
        id: destination
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "destination_dir=reports/pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "keep_files=false" >> "$GITHUB_OUTPUT"
            echo "is_root=false" >> "$GITHUB_OUTPUT"
          else
            echo "destination_dir=." >> "$GITHUB_OUTPUT"
            echo "keep_files=true" >> "$GITHUB_OUTPUT"
            echo "is_root=true" >> "$GITHUB_OUTPUT"
          fi

      # peaceiris with keep_files:false and destination_dir "." wipes the
      # whole gh-pages branch (everything except .git) before copying the
      # new report in — that would take reports/pr-*/ with it. So once
      # gh-pages exists, the root report is swapped in by hand, in one
      # commit: the previous root-level report is removed (reports/, .git
      # and .nojekyll stay), the new one copied in, and reports/main/ kept
      # as a redirect to the root so links from before the move still
      # work. One commit means a failed run leaves the old report in place
      # rather than an empty site root.
      - name: Check for a gh-pages branch
        id: pages-branch
        if: steps.destination.outputs.is_root == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/branches/gh-pages" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No gh-pages branch yet: the first publish below creates it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages for the root report
        if: steps.destination.outputs.is_root == 'true' && steps.pages-branch.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-root
          fetch-depth: 1

      - name: Publish the root report to gh-pages
        id: deploy-root
        if: steps.destination.outputs.is_root == 'true' && steps.pages-branch.outputs.exists == 'true'
        continue-on-error: true
        working-directory: gh-pages-root
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name reports ! -name .git ! -name .nojekyll -exec rm -rf {} +
          cp -R ../site/. .
          touch .nojekyll
          rm -rf reports/main
          mkdir -p reports/main
          cat > reports/main/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>The report has moved</title>
          <script>location.replace('../../' + location.hash)</script>
          <meta http-equiv="refresh" content="0; url=../../">
          </head>
          <body><p>The report has moved to <a href="../../">the site root</a>.</p></body>
          </html>
          HTML
          if [ -z "$(git status --porcelain)" ]; then
            echo "The root report is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish the prototype demo page and Playwright report for main at the site root"
          git push origin gh-pages

      # For a pull request, keep_files:false replaces just reports/pr-<n>/,
      # so the last run's videos go with it and nothing else is touched. At
      # the root this runs only for the very first publish (no gh-pages
      # yet), which creates the branch; keep_files is true there anyway.
      - name: Publish to gh-pages
        id: deploy
        if: steps.destination.outputs.is_root != 'true' || steps.pages-branch.outputs.exists != 'true'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: ${{ steps.destination.outputs.destination_dir }}
          keep_files: ${{ steps.destination.outputs.keep_files }}

      - name: Find the report's web address
        id: address
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYED: ${{ steps.deploy.outcome == 'success' || steps.deploy-root.outcome == 'success' }}
          IS_ROOT: ${{ steps.destination.outputs.is_root }}
          DESTINATION_DIR: ${{ steps.destination.outputs.destination_dir }}
        run: |
          # gh api prints the error body to stdout on a 404, so keep the
          # address only when the call succeeded and it is a real https URL.
          site=""
          if found=$(gh api "repos/${REPO}/pages" --jq .html_url 2>/dev/null); then
            case "$found" in
              https://*) site="$found" ;;
            esac
          fi
          if [ "$DEPLOYED" = "true" ] && [ -n "$site" ]; then
            case "$site" in
              */) ;;
              *) site="${site}/" ;;
            esac
            if [ "$IS_ROOT" = "true" ]; then
              echo "url=${site}" >> "$GITHUB_OUTPUT"
            else
              echo "url=${site}${DESTINATION_DIR}/" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "GitHub Pages is not on (or publishing failed), so there is no web link. The report is in the prototype-playwright-report download."
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the report comment
        env:
          REPORT_URL: ${{ steps.address.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/reports/pr-comment.js merged/report.json > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ids=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- prototype-playwright-report -->")) | .id')
          existing="${ids%%$'\n'*}"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@comment.md
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@comment.md
          fi
