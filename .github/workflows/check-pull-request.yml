name: Check Pull Request

on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The npm that installs must be the npm that generated package-lock.json:
      # different npms resolve some transitive trees differently, and `npm ci`
      # then rejects a lockfile generated by the other one. Take the version
      # from `packageManager` rather than inheriting whatever npm the Node
      # version happens to bundle. The helper validates the field and strips any
      # Corepack integrity suffix, so a malformed pin fails the step instead of
      # installing the wrong npm.
      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - run: |
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag trade-imports-plants-prototype .
          exit $?

  # Proves on every pull request — and every Monday, after the weekly update
  # from plants-frontend — that a designer can still make a design release
  # from the real journey: the copy boots, lints, passes the unit suite and
  # shows on the chooser. Runs after the unit tests. The release it makes is
  # thrown away at the end and never committed.
  release-canary:
    name: Design release canary
    runs-on: ubuntu-latest
    needs: pr-validator
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      # plants-working is the id every designer's first release gets
      # (CLAUDE.md rule 9), and designer docs name example paths inside it, so
      # the canary proves that exact release can be saved.
      - name: Make a throwaway design release from the real journey
        run: npm run new:set -- plants-working --from high-risk-plants --title "Working release" --describe "A throwaway copy of the real journey, made by CI"

      - name: Lint and unit tests with the release mounted
        run: |
          npm run lint
          npm test

      - name: Install the Playwright browser
        run: npm run playwright:install

      - name: Chooser boot check with the release mounted
        run: npm run test:fit -- --project=journeys fit/sets-chooser.fit.spec.js

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-canary-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Throw the canary release away
        if: always()
        run: |
          git restore .
          git clean -fdq -- src/server

  # Deliberately a separate job from pr-validator. `npm audit` scans the whole
  # installed tree against a live advisory feed, so a newly published advisory
  # turns every open PR red regardless of what that PR changed — and advisories
  # on indirect dependencies often have no upgrade path, needing a hand-written
  # `overrides` entry on main to clear. Folded into pr-validator, that failure
  # mode blocks the very PR carrying the fix. Kept separate, the audit stays
  # visible on every PR without being the check that gates the merge.
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run security-audit

  # The frontend owns two Playwright projects — `features` and `journeys` —
  # which boot the app themselves with STUB_MODE=true: stub data and a locally
  # signed session in place of the Defra ID round-trip, auth still enforced (see
  # src/server/auth/stub-sign-in.js), so they need no workspace stack. Kept out
  # of pr-validator so a browser run does not sit in front of the rest of the
  # PR checks.
  playwright:
    name: FIT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      # Chromium only: both projects use devices['Desktop Chrome'].
      - name: Install the Playwright browser
        run: npm run playwright:install

      - name: Run the frontend-owned Playwright suites
        run: npm run test:fit:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
