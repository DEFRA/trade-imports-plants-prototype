name: Check Pull Request

on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The npm that installs must be the npm that generated package-lock.json:
      # different npms resolve some transitive trees differently, and `npm ci`
      # then rejects a lockfile generated by the other one. Take the version
      # from `packageManager` rather than inheriting whatever npm the Node
      # version happens to bundle. The helper validates the field and strips any
      # Corepack integrity suffix, so a malformed pin fails the step instead of
      # installing the wrong npm.
      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - run: |
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag trade-imports-plants-prototype .
          exit $?

  # Proves the built image is the thing that reaches CDP dev, not just that it
  # builds: boots it in NODE_ENV=production beside the real Defra ID stub image
  # (never the local-only stub sign-in, which production never registers — see
  # production-run.test.js) and drives a full sign-in, the same route a trader
  # takes. Runs after pr-validator so it never boots an image that failed unit
  # tests or the plain `docker build`.
  boot-check:
    name: Production boot check
    runs-on: ubuntu-latest
    needs: pr-validator
    timeout-minutes: 15
    env:
      # Every DEFRA_ID_* value here only stands in for CDP dev's real ones
      # (a real client id/secret, the real Defra ID discovery URL) so this job
      # can drive a real OIDC round trip against the stub instead:
      # - DEFRA_ID_OIDC_CONFIGURATION_URL reaches the stub by its container
      #   name on the network below, the same way the workspace's own dev
      #   stack reaches it by host.docker.internal
      #   (docker/stack/frontend.compose.yml) — a plain container name works
      #   here because both containers share one Docker network.
      # - DEFRA_ID_REDIRECT_URL and DEFRA_ID_SIGN_OUT_REDIRECT_URL are
      #   browser-visible (src/config/config.js), so they name this job's own
      #   published port on localhost, the same shape as the 3103 default.
      # - SESSION_COOKIE_SECURE is off because this job's curl session talks
      #   to the container over plain HTTP: production's real default (a
      #   Secure cookie) is right for CDP's HTTPS front door, but would stop
      #   curl sending the session cookie back here.
      DEFRA_ID_STUB_PORT: 3007
      APP_PORT: 3103
      AUTH_PASSWORD: Password123
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the image under test
        run: docker build --tag trade-imports-plants-prototype .

      - name: Create a network for the app and the Defra ID stub
        run: docker network create boot-check

      - name: Start the Defra ID stub
        run: |
          docker run -d --name defra-id-stub --network boot-check \
            -p "${DEFRA_ID_STUB_PORT}:${DEFRA_ID_STUB_PORT}" \
            -e "PORT=${DEFRA_ID_STUB_PORT}" \
            -e AUTH_MODE=mock \
            -e SECURE_COOKIE=false \
            -e "AUTH_PASSWORD=${AUTH_PASSWORD}" \
            -e "WELL_KNOWN_HOST_OVERRIDE=http://localhost:${DEFRA_ID_STUB_PORT}" \
            defradigital/trade-imports-defra-id-stub:latest

      - name: Wait for the Defra ID stub to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl --fail --silent "http://localhost:${DEFRA_ID_STUB_PORT}/health" && exit 0
            sleep 2
          done
          echo "The Defra ID stub never became healthy" >&2
          docker logs defra-id-stub
          exit 1

      - name: Start the prototype
        run: |
          docker run -d --name plants-prototype --network boot-check \
            -p "${APP_PORT}:${APP_PORT}" \
            -e NODE_ENV=production \
            -e "PORT=${APP_PORT}" \
            -e SESSION_COOKIE_SECURE=false \
            -e "DEFRA_ID_OIDC_CONFIGURATION_URL=http://defra-id-stub:${DEFRA_ID_STUB_PORT}/idphub/b2c/b2c_1a_cui_cpdev_signupsigninsfi/.well-known/openid-configuration" \
            -e "DEFRA_ID_REDIRECT_URL=http://localhost:${APP_PORT}/auth/sign-in-oidc" \
            -e "DEFRA_ID_SIGN_OUT_REDIRECT_URL=http://localhost:${APP_PORT}/auth/sign-out-oidc" \
            trade-imports-plants-prototype

      - name: Wait for the prototype to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl --fail --silent "http://localhost:${APP_PORT}/health" && exit 0
            sleep 2
          done
          echo "The prototype never became healthy" >&2
          docker logs plants-prototype
          exit 1

      - name: Assert the chooser and a real page's sign-in are wired up
        run: |
          chooser_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:${APP_PORT}/")
          if [ "$chooser_status" != "200" ]; then
            echo "Expected the chooser at / to be 200 signed out, got $chooser_status" >&2
            exit 1
          fi

          # The prototype's own `/` is the chooser, not a redirect (it stands
          # in for plants-frontend's redirect to its default set — see
          # src/server/prototype-sets/index.js) — a real set behind it is
          # where sign-in is enforced, the same as plants-frontend's `/`.
          real_set_redirect=$(curl --silent --output /dev/null --write-out '%{redirect_url}' "http://localhost:${APP_PORT}/high-risk-plants")
          case "$real_set_redirect" in
            */auth/sign-in) ;;
            *)
              echo "Expected /high-risk-plants to redirect to /auth/sign-in signed out, got: $real_set_redirect" >&2
              exit 1
              ;;
          esac

      - name: Sign in through the Defra ID stub and reach the chooser
        run: |
          jar="$RUNNER_TEMP/boot-check-cookies.txt"

          sign_in_page=$(curl --silent --cookie-jar "$jar" --cookie "$jar" --location "http://localhost:${APP_PORT}/auth/sign-in")
          if ! echo "$sign_in_page" | grep -q 'name="crn"'; then
            echo "Did not reach the Defra ID stub's sign-in form" >&2
            exit 1
          fi

          # Sarah Plumber (the stub's mock data, src/data/mock.json) has two
          # organisations, so this exercises the stub's own organisation-select
          # form rather than the single-organisation auto-select.
          picker_page=$(curl --silent --cookie-jar "$jar" --cookie "$jar" --location \
            --data-urlencode "crn=2100010102" \
            --data-urlencode "password=${AUTH_PASSWORD}" \
            "http://localhost:${DEFRA_ID_STUB_PORT}/dcidmtest.onmicrosoft.com/oauth2/authresp")
          if ! echo "$picker_page" | grep -q 'name="sbi"'; then
            echo "Did not reach the Defra ID stub's organisation-select form" >&2
            exit 1
          fi

          chooser_page=$(curl --silent --cookie-jar "$jar" --cookie "$jar" --location \
            --data-urlencode "sbi=110100102" \
            "http://localhost:${DEFRA_ID_STUB_PORT}/organisations")
          if ! echo "$chooser_page" | grep -q 'href="/high-risk-plants"'; then
            echo "Did not land back on the chooser after sign-in" >&2
            exit 1
          fi

          echo "BOOT_CHECK_COOKIE_JAR=$jar" >> "$GITHUB_ENV"

      - name: Open a release page
        run: |
          status=$(curl --silent --cookie "$BOOT_CHECK_COOKIE_JAR" --output /dev/null --write-out '%{http_code}' "http://localhost:${APP_PORT}/high-risk-plants")
          if [ "$status" != "200" ]; then
            echo "Expected the high-risk-plants dashboard to be 200 signed in, got $status" >&2
            exit 1
          fi

      - name: Open an example link
        run: |
          status=$(curl --silent --cookie "$BOOT_CHECK_COOKIE_JAR" --location --output /dev/null --write-out '%{http_code}' "http://localhost:${APP_PORT}/examples/high-risk-plants/submitted")
          if [ "$status" != "200" ]; then
            echo "Expected the submitted example link to be 200 signed in, got $status" >&2
            exit 1
          fi

      - name: Show container logs
        if: failure()
        run: |
          echo "::group::plants-prototype"
          docker logs plants-prototype || true
          echo "::endgroup::"
          echo "::group::defra-id-stub"
          docker logs defra-id-stub || true
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: |
          docker rm --force plants-prototype defra-id-stub || true
          docker network rm boot-check || true

  # Proves on every pull request — and every Monday, after the weekly update
  # from plants-frontend — that a designer can still make a design release
  # from the real journey: the copy boots, lints, passes the unit suite and
  # shows on the chooser. Runs after the unit tests. The release it makes is
  # thrown away at the end and never committed.
  release-canary:
    name: Design release canary
    runs-on: ubuntu-latest
    needs: pr-validator
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      # plants-working is the id every designer's first release gets
      # (CLAUDE.md rule 9), and designer docs name example paths inside it, so
      # the canary proves that exact release can be saved.
      - name: Make a throwaway design release from the real journey
        run: npm run new:set -- plants-working --from high-risk-plants --title "Working release" --describe "A throwaway copy of the real journey, made by CI"

      - name: Lint and unit tests with the release mounted
        run: |
          npm run lint
          npm test

      - name: Install the Playwright browser
        run: npm run playwright:install

      - name: Chooser boot check with the release mounted
        run: npm run test:fit -- --project=journeys fit/sets-chooser.fit.spec.js

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-canary-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Throw the canary release away
        if: always()
        run: |
          git restore .
          git clean -fdq -- src/server

  # Deliberately a separate job from pr-validator. `npm audit` scans the whole
  # installed tree against a live advisory feed, so a newly published advisory
  # turns every open PR red regardless of what that PR changed — and advisories
  # on indirect dependencies often have no upgrade path, needing a hand-written
  # `overrides` entry on main to clear. Folded into pr-validator, that failure
  # mode blocks the very PR carrying the fix. Kept separate, the audit stays
  # visible on every PR without being the check that gates the merge.
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run security-audit

  # The frontend owns two Playwright projects — `features` and `journeys` —
  # which boot the app themselves with STUB_MODE=true: stub data and a locally
  # signed session in place of the Defra ID round-trip, auth still enforced (see
  # src/server/auth/stub-sign-in.js), so they need no workspace stack. Kept out
  # of pr-validator so a browser run does not sit in front of the rest of the
  # PR checks.
  playwright:
    name: FIT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      # Chromium only: both projects use devices['Desktop Chrome'].
      - name: Install the Playwright browser
        run: npm run playwright:install

      - name: Run the frontend-owned Playwright suites
        run: npm run test:fit:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
